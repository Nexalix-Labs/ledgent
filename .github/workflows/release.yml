name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # NOTE: pin these to full commit SHAs for supply-chain hardening; Dependabot
      # (.github/dependabot.yml) tracks updates. Kept on tags here for readability.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Derive and validate version from tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Reject anything that is not clean semver — kills tag-name injection at the source.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "tag '$GITHUB_REF_NAME' is not semver" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Sync version into sources
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # VERSION is read from the environment, never interpolated into the JS source.
          node -e "const fs=require('fs');const p='src/version.ts';const v=process.env.VERSION;const s=fs.readFileSync(p,'utf8').replace(/export const VERSION = \"[^\"]*\";/, 'export const VERSION = \"'+v+'\";');fs.writeFileSync(p,s)"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (npm bin) + bundle (OTA artifact)
        run: |
          npm run build
          npm run bundle

      - name: Checksums
        run: cd dist && sha256sum ledgent.mjs > SHA256SUMS

      - name: Sign checksums (if a signing key is configured)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "no SIGNING_KEY secret — shipping sha256-only (transport integrity)."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > signing_key.pem
          openssl pkeyutl -sign -inkey signing_key.pem -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig.bin
          base64 -w0 dist/SHA256SUMS.sig.bin > dist/SHA256SUMS.sig
          rm -f signing_key.pem dist/SHA256SUMS.sig.bin

      - name: GitHub Release (OTA channel)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ledgent.mjs
            dist/SHA256SUMS*

      # npm is the second channel. Requires the NPM_TOKEN secret; the GitHub
      # release above (the OTA channel) is unaffected if npm publish is skipped.
      - name: Publish to npm
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
