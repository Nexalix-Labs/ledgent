name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Trusted publishing: npm exchanges this short-lived OIDC token for publish
  # rights, so the repo holds no long-lived npm credential at all.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # NOTE: pin these to full commit SHAs for supply-chain hardening; Dependabot
      # (.github/dependabot.yml) tracks updates. Kept on tags here for readability.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0; 24 also ships npm 11.x.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Pin the floor explicitly rather than trusting whichever npm the Node
      # image happens to bundle — trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Derive and validate version from tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Reject anything that is not clean semver — kills tag-name injection at the source.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "tag '$GITHUB_REF_NAME' is not semver" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Sync version into sources
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # VERSION is read from the environment, never interpolated into the JS source.
          node -e "const fs=require('fs');const p='src/version.ts';const v=process.env.VERSION;const s=fs.readFileSync(p,'utf8').replace(/export const VERSION = \"[^\"]*\";/, 'export const VERSION = \"'+v+'\";');fs.writeFileSync(p,s)"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (npm bin) + bundle (OTA artifact)
        run: |
          npm run build
          npm run bundle

      - name: Checksums
        run: cd dist && sha256sum ledgent.mjs > SHA256SUMS

      - name: Sign checksums (if a signing key is configured)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "no SIGNING_KEY secret — shipping sha256-only (transport integrity)."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > signing_key.pem
          openssl pkeyutl -sign -inkey signing_key.pem -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig.bin
          base64 -w0 dist/SHA256SUMS.sig.bin > dist/SHA256SUMS.sig
          rm -f signing_key.pem dist/SHA256SUMS.sig.bin

      - name: GitHub Release (OTA channel)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ledgent.mjs
            dist/SHA256SUMS*

      # npm is the second channel, published via trusted publishing (OIDC) — no
      # NPM_TOKEN secret, and npm attaches a provenance attestation on its own.
      # Requires a Trusted Publisher on npmjs.com pointing at this repo and this
      # workflow filename; without it the step fails and the run goes red.
      #
      # Deliberately NOT continue-on-error: masking this is how v0.2.0 shipped a
      # green run while npm publish died on ENEEDAUTH. The GitHub Release above
      # is already created by this point, so a failure here costs only the npm
      # channel — rerun the job once the npm side is fixed.
      - name: Publish to npm
        run: npm publish --access public
